name: CI/CD Focus CRM con SQL Server

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Password_Fuerte_123!
          ACCEPT_EULA: Y
          # FORZAMOS AL SQL A USAR TU PUERTO DESDE ADENTRO
          MSSQL_TCP_PORT: 56719
        ports:
          - 56719:56719

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Correr Pruebas (Tests)
        run: |
          echo "Dándole 30 segundos para que el puerto 56719 responda..."
          sleep 30
          npm test
        env:
          DB_HOST: localhost
          DB_PORT: 56719
          DB_PASSWORD: Password_Fuerte_123!

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: luisstrdocker/focus-crm:v1