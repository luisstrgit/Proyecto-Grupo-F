name: CI/CD Focus CRM con SQL Server

on:
  push:
    branches: [ "main", "develop" ] # Se activa al subir a estas ramas

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # GitHub enciende un SQL Server automático para tus pruebas
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Password_Fuerte_123!
          ACCEPT_EULA: Y
        ports:
          - 1433:1433

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      # Aquí se ejecutan tus archivos .test.js
      - name: Correr Pruebas (Tests)
        run: npm test
        env:
          DB_HOST: localhost
          DB_PASSWORD: Password_Fuerte_123!

      # Si los tests pasan, GitHub se loguea en tu Docker Hub
      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # El robot construye la imagen y la sube sola
      - name: Build y Push a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: luisstrdocker/focus-crm:v1