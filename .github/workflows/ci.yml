name: CI/CD Focus CRM con SQL Server

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          # Usamos tu contraseña real aquí
          SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ACCEPT_EULA: Y
          MSSQL_TCP_PORT: 56719
        ports:
          - 56719:56719

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Correr Pruebas (Tests)
        run: |
          echo "Esperando 30s con tu contraseña real..."
          sleep 30
          npm test
        env:
          DB_HOST: localhost
          DB_PORT: 56719
          # El robot usará la misma contraseña que tu código
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: FocusCRM